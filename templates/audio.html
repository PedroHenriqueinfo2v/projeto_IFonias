<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ audio.titulo }} - IFonias</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/audio.css') }}">
</head>

<body>

<a href="{{ url_for('timeline') }}" class="btn-voltar">← Voltar</a>

<div class="audio-container">

    <h1>{{ audio.titulo }}</h1>

    <p class="audio-meta">
        Publicado por <strong>{{ audio.nome }}</strong> — @{{ audio.usuario }}
    </p>

    {% if audio.avatar %}
        <img src="{{ url_for('static', filename='avatars/' ~ audio.avatar) }}" class="audio-avatar">
    {% endif %}

    <audio controls class="audio-player">
        <source src="{{ url_for('static', filename='audios/' ~ audio.arquivo_audio) }}" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    {% if audio.legenda %}
    <p class="legenda">{{ audio.legenda }}</p>
    {% endif %}

</div>

</body>
</html>
